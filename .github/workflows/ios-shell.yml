name: iOS 壳 App（模拟器）

on:
  push:
    branches: [ feature/mobile, main ]
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/ios-shell.yml'
  workflow_dispatch:

jobs:
  simulator:
    name: 编译 → 启动模拟器 → 截图
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          xcrun simctl list devices available | sed -n '1,30p'

      - name: 编译（iphonesimulator）
        working-directory: mobile/ios
        run: |
          set -e
          xcodebuild \
            -project ChessCoach.xcodeproj \
            -scheme ChessCoach \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 启动模拟器并安装
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(dev["udid"] for rt in sorted(d) for dev in d[rt] if dev["name"].startswith("iPhone")))')
          echo "已选模拟器 UDID=$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "mobile/ios/build/Build/Products/Debug-iphonesimulator/ChessCoach.app"

      - name: 截图 1 —— 首次启动（配置页）
        run: |
          set -euo pipefail
          xcrun simctl launch "$UDID" com.chesscoach.mobile
          sleep 6
          xcrun simctl io "$UDID" screenshot mobile/ios/shot-1-config.png

      - name: 截图 2 —— 预置地址后启动（WebView 加载本地 mock）
        run: |
          set -euo pipefail
          mkdir -p mock/mobile
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mock</title><body style="font-family:sans-serif;padding:2rem"><h2>WebView OK</h2><p>CI 里的假后端，用于验证 WKWebView 能正常加载页面。</p></body>' > mock/mobile/index.html
          python3 --version
          nohup python3 -m http.server 5002 --bind 127.0.0.1 --directory mock > /tmp/mock.log 2>&1 &
          echo "mock pid=$!"
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 2 http://127.0.0.1:5002/mobile/ || true)
            echo "等待 mock 就绪 $i: HTTP $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          echo "== 端口监听 =="; lsof -nP -iTCP:5002 || true
          echo "== mock 启动日志 =="; cat /tmp/mock.log || true
          xcrun simctl terminate "$UDID" com.chesscoach.mobile || true
          xcrun simctl launch "$UDID" com.chesscoach.mobile -cc_host 127.0.0.1 -cc_port 5002
          sleep 20
          xcrun simctl io "$UDID" screenshot mobile/ios/shot-2-webview.png
          echo "== mock 访问日志（尾） =="; tail -n 20 /tmp/mock.log || true

      - name: 诊断（打印 App 日志与崩溃报告）
        if: always()
        run: |
          echo "== ChessCoach 最近日志 =="
          xcrun simctl spawn "$UDID" log show --last 3m --style compact \
            --predicate 'process == "ChessCoach" OR eventMessage CONTAINS "ChessCoach"' 2>/dev/null | tail -n 120 || true
          echo "== 崩溃报告 =="
          ls -1t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -n 10 || true

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshots
          path: mobile/ios/shot-*.png
          if-no-files-found: warn

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>离线 · 象棋教练</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#1a1a2e;color:#fdf6e6;
    font-family:'Microsoft YaHei',-apple-system,'Segoe UI',Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  .box{max-width:360px}
  .piece{
    width:96px;height:96px;border-radius:50%;margin:0 auto 22px;
    display:flex;align-items:center;justify-content:center;
    font-size:46px;font-weight:700;color:#c0392b;
    background:radial-gradient(circle at 35% 28%,#fffdf7,#eed9b4);
    border:3px solid #b98b4e;box-shadow:0 4px 18px rgba(0,0,0,.45);
  }
  h1{font-size:19px;margin:0 0 10px}
  p{font-size:14px;line-height:1.8;color:#c9c2b6;margin:0 0 22px}
  button{
    min-height:46px;padding:10px 26px;font-size:15px;cursor:pointer;
    border:0;border-radius:10px;background:#c0392b;color:#fff;
  }
  button:active{background:#a93226}
  .hint{margin-top:18px;font-size:12px;color:#7d766b;line-height:1.7}
</style>
</head>
<body>
  <div class="box">
    <div class="piece">帅</div>
    <h1>需要连接电脑</h1>
    <p>离线状态：暂时连不上运行 Flask 的电脑。<br>
       引擎分析与 AI 提示都需要电脑端在线，请检查手机与电脑是否在同一 Wi-Fi。</p>
    <button id="retry">重试</button>
    <div class="hint">联网后点「重试」，或直接重新打开「象棋教练」。</div>
  </div>
<script>
  document.getElementById('retry').addEventListener('click', () => location.reload());
</script>
</body>
</html>
